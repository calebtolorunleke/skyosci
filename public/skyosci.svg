<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Core Electric Blue to Vibrant Cyan Gradient -->
    <linearGradient id="skyosci-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Subtle Clean Glow for Legibility -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00E5FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Bold Dynamic Orbital Intelligence Ring -->
  <ellipse cx="32" cy="34" rx="26" ry="12" fill="none" stroke="url(#skyosci-gradient)" stroke-width="4.5" transform="rotate(-25 32 34)" opacity="0.95" />

  <!-- Amplified Minimalist Cloud Mark -->
  <path d="M17 38 
           C13.134 38 10 34.866 10 31 
           C10 27.42 12.75 24.5 16.15 24.16 
           C17.48 19.34 21.84 16 27 16 
           C32.52 16 37.1 19.98 38.08 25.32 
           C41.16 25.74 43.5 28.38 43.5 31.5 
           C43.5 34.98 40.68 38 37.2 38 
           L17 38 Z" fill="url(#skyosci-gradient)" filter="url(#subtle-glow)" />

  <!-- Prominent Real-Time Data Pulse Node -->
  <circle cx="26" cy="28" r="4" fill="#FFFFFF" />
  <circle cx="26" cy="28" r="7" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.8" />
</svg>